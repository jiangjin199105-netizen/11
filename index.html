    <meta name="theme-color" content="#0a0a0f" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>

        theme: {
          extend: {
            colors: {
              cyber: {
                900: '#0a0a0f',
                800: '#12121a',
                700: '#1c1c2e',
                600: '#2a2a40',
                500: '#3d3d5c',
                accent: '#00f0ff',
                danger: '#ff2a6d',
                success: '#05ffa1',
                warning: '#fcee0a'
              }

          }
        }
      }

    <style>
      body {
        background-color: #0a0a0f;
        color: #e2e8f0;
        margin: 0;

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #12121a;

      }
      ::-webkit-scrollbar-thumb:hover {

      }
    </style>
